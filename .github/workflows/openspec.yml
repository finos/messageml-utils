name: OpenSpec

on:
  push:
    branches: [ 'main', '*-rc' ]
  pull_request:
    branches: [ 'main', '*-rc' ]

jobs:
  archived:
    name: "Check changes are archived"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Check all OpenSpec changes are archived
      # Every change under openspec/changes/ (except archive/) must be archived before merging.
      # A change can opt out by setting `allowUnarchived: true` in its .openspec.yaml,
      # e.g. when only the spec is committed and implementation comes later.
      run: |
        failed=0
        for dir in openspec/changes/*/; do
          name=$(basename "$dir")
          [ "$name" = "archive" ] && continue
          if grep -Eqs '^allowUnarchived:[[:space:]]*true[[:space:]]*(#.*)?$' "$dir.openspec.yaml"; then
            echo "Skipping '$name': allowUnarchived is set"
            continue
          fi
          echo "::error file=${dir}.openspec.yaml::Change '$name' is not archived. Run 'openspec archive $name' or set 'allowUnarchived: true' in its .openspec.yaml"
          failed=1
        done
        exit $failed
